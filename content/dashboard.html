<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2분기 프로젝트 진행 현황 대시보드</title>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 1200px; margin: auto; }
        .header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; overflow-x: auto; }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 10px; color: #2c3e50; margin-top: 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; white-space: nowrap; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        .progress-bg { background-color: #e0e0e0; border-radius: 5px; height: 20px; min-width: 100px; overflow: hidden; position: relative; }
        .progress-fill { background-color: #27ae60; height: 100%; transition: width 0.5s ease-in-out; }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 0; left: 0; font-size: 12px; line-height: 20px; font-weight: bold; color: #333; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>📊 2분기 프로젝트 진행 현황 대시보드</h1>
        <p>한맥 PM팀 실시간 업무 보드 (Google Sheets 연동)</p>
    </div>

    <div class="card">
        <h2>🚀 주요 프로젝트</h2>
        <div id="table-1">데이터를 불러오는 중입니다...</div>
    </div>

    <div class="card">
        <h2>🔄 상시업무</h2>
        <div id="table-2">데이터를 불러오는 중입니다...</div>
    </div>

    <div class="card">
        <h2>📝 업무로그</h2>
        <div id="table-3">데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script>
    // 3개의 CSV 링크와 각각 표가 들어갈 위치(id)를 매칭해 둡니다.
    const sheetData = [
        { 
            url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMovf5Tjn4pSI5za_FGBogWnj8eXcEKSigPiHmiuLSX1wfEchn7w99Iwlrzd3taZuoQIV1Mf94bce2/pub?gid=0&single=true&output=csv", 
            containerId: "table-1" 
        },
        { 
            url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMovf5Tjn4pSI5za_FGBogWnj8eXcEKSigPiHmiuLSX1wfEchn7w99Iwlrzd3taZuoQIV1Mf94bce2/pub?gid=899664195&single=true&output=csv", 
            containerId: "table-2" 
        },
        { 
            url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMovf5Tjn4pSI5za_FGBogWnj8eXcEKSigPiHmiuLSX1wfEchn7w99Iwlrzd3taZuoQIV1Mf94bce2/pub?gid=1266255410&single=true&output=csv", 
            containerId: "table-3" 
        }
    ];

    // 여러 개의 링크를 순회하면서 파싱(Parsing)하는 함수
    function loadAllData() {
        sheetData.forEach(sheet => {
            Papa.parse(sheet.url, {
                download: true,
                header: true,
                complete: function(results) {
                    drawTable(results.data, sheet.containerId);
                },
                error: function(err) {
                    document.getElementById(sheet.containerId).innerHTML = "데이터 연동 실패";
                    console.error(err);
                }
            });
        });
    }

    // 가져온 데이터로 HTML 표를 그리는 함수 (위치 ID를 추가로 받음)
    function drawTable(data, containerId) {
        if (data.length === 0) {
            document.getElementById(containerId).innerHTML = "데이터가 없습니다.";
            return;
        }

        let tableHTML = '<table><thead><tr>';
        const columns = Object.keys(data[0]);
        
        columns.forEach(col => {
            tableHTML += `<th>${col}</th>`;
        });
        tableHTML += '</tr></thead><tbody>';

        data.forEach(row => {
            if (!row[columns[0]]) return; 

            tableHTML += '<tr>';
            columns.forEach(col => {
                let cellValue = row[col] || '';
                
                // 진행률 처리 로직
                if (col.includes('진행') && cellValue) {
                    let percent = cellValue.replace(/[^0-9]/g, ''); 
                    if(percent) {
                        cellValue = `
                            <div class="progress-bg">
                                <div class="progress-fill" style="width: ${percent}%;"></div>
                                <div class="progress-text">${percent}%</div>
                            </div>
                        `;
                    }
                }
                tableHTML += `<td>${cellValue}</td>`;
            });
            tableHTML += '</tr>';
        });

        tableHTML += '</tbody></table>';
        document.getElementById(containerId).innerHTML = tableHTML;
    }

    window.onload = loadAllData;
</script>

</body>
</html>
